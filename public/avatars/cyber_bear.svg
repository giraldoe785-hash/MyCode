<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgBear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bearEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowBear">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="60" fill="url(#bgBear)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="#10B981" stroke-width="2" opacity="0.3" />
  
  <!-- Round Ears -->
  <circle cx="34" cy="38" r="16" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <circle cx="34" cy="38" r="8" fill="url(#bearEmerald)" />
  <circle cx="86" cy="38" r="16" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <circle cx="86" cy="38" r="8" fill="url(#bearEmerald)" />
  
  <!-- Bear Armor -->
  <polygon points="60,36 88,52 86,92 60,102 34,92 32,52" fill="#0F172A" stroke="#334155" stroke-width="2" />
  
  <!-- Visor -->
  <path d="M 40 58 Q 60 52 80 58 L 78 68 Q 60 62 42 68 Z" fill="#10B981" filter="url(#glowBear)" />
  <line x1="44" y1="63" x2="76" y2="63" stroke="#FFFFFF" stroke-width="1.5" />
  
  <!-- Heavy Snout Plate -->
  <polygon points="60,72 74,86 60,96 46,86" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <polygon points="60,78 66,84 54,84" fill="#34D399" filter="url(#glowBear)" />
</svg>