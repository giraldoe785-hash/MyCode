<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgEagle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="eagleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glowEagle">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="60" fill="url(#bgEagle)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="#FACC15" stroke-width="2" opacity="0.35" />
  
  <!-- Crest Feathers -->
  <polygon points="60,16 66,35 54,35" fill="url(#eagleGold)" filter="url(#glowEagle)" />
  <polygon points="46,22 56,38 42,36" fill="#3B82F6" />
  <polygon points="74,22 64,38 78,36" fill="#3B82F6" />
  
  <!-- Head Mask -->
  <path d="M 36 45 Q 60 30 84 45 L 82 75 Q 60 90 38 75 Z" fill="#1E293B" stroke="#3B82F6" stroke-width="2" />
  <polygon points="60,38 76,52 60,70 44,52" fill="#0F172A" stroke="#60A5FA" stroke-width="1.5" />
  
  <!-- Eagle Eyes / Targeter -->
  <polygon points="40,54 52,56 48,62 38,58" fill="#FACC15" filter="url(#glowEagle)" />
  <polygon points="80,54 68,56 72,62 82,58" fill="#FACC15" filter="url(#glowEagle)" />
  
  <!-- Beak -->
  <polygon points="60,65 72,82 60,104 48,82" fill="url(#eagleGold)" stroke="#CA8A04" stroke-width="2" />
  <line x1="60" y1="65" x2="60" y2="98" stroke="#713F12" stroke-width="1.5" />
</svg>