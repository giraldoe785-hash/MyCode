<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgLion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="lionMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glowLion">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="60" fill="url(#bgLion)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="#EC4899" stroke-width="2" opacity="0.4" />
  
  <!-- Geometric Mane -->
  <polygon points="60,14 74,28 88,18 84,36 102,34 92,50 106,58 92,70 100,86 82,86 80,102 60,94 40,102 38,86 20,86 28,70 14,58 28,50 18,34 36,36 32,18 46,28" fill="url(#lionMane)" opacity="0.85" />
  
  <!-- Face Core -->
  <polygon points="60,34 80,50 74,86 60,94 46,86 40,50" fill="#0F172A" stroke="#EC4899" stroke-width="2" />
  
  <!-- Cyber Eyes -->
  <polygon points="46,54 56,56 52,62 42,60" fill="#FACC15" filter="url(#glowLion)" />
  <polygon points="74,54 64,56 68,62 78,60" fill="#FACC15" filter="url(#glowLion)" />
  
  <!-- Nose & Chin -->
  <polygon points="60,70 68,82 52,82" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" />
  <polygon points="60,76 64,80 56,80" fill="#EC4899" filter="url(#glowLion)" />
  <circle cx="60" cy="42" r="2.5" fill="#38BDF8" filter="url(#glowLion)" />
</svg>