<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgCat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="catNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glowCat">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="60" fill="url(#bgCat)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="#EC4899" stroke-width="2" opacity="0.35" stroke-dasharray="5 3" />
  
  <!-- Cat Ears -->
  <polygon points="32,25 50,50 25,48" fill="#1E1B4B" stroke="#EC4899" stroke-width="2" />
  <polygon points="35,32 46,47 30,46" fill="url(#catNeon)" />
  <polygon points="88,25 70,50 95,48" fill="#1E1B4B" stroke="#EC4899" stroke-width="2" />
  <polygon points="85,32 74,47 90,46" fill="url(#catNeon)" />
  
  <!-- Face Plate -->
  <polygon points="60,42 86,58 78,92 60,98 42,92 34,58" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" />
  
  <!-- Cyber Eyes -->
  <ellipse cx="48" cy="64" rx="8" ry="5" fill="#06B6D4" filter="url(#glowCat)" transform="rotate(-10 48 64)" />
  <ellipse cx="72" cy="64" rx="8" ry="5" fill="#06B6D4" filter="url(#glowCat)" transform="rotate(10 72 64)" />
  <line x1="48" y1="61" x2="48" y2="67" stroke="#FFFFFF" stroke-width="2" />
  <line x1="72" y1="61" x2="72" y2="67" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Whiskers / Audio sensors -->
  <line x1="30" y1="74" x2="16" y2="70" stroke="#EC4899" stroke-width="2" />
  <line x1="30" y1="80" x2="14" y2="82" stroke="#EC4899" stroke-width="2" />
  <line x1="90" y1="74" x2="104" y2="70" stroke="#EC4899" stroke-width="2" />
  <line x1="90" y1="80" x2="106" y2="82" stroke="#EC4899" stroke-width="2" />
  
  <!-- Nose & Mouth -->
  <polygon points="60,76 64,80 56,80" fill="#EC4899" filter="url(#glowCat)" />
  <path d="M 54 86 Q 60 90 66 86" stroke="#8B5CF6" stroke-width="2" fill="none" />
</svg>